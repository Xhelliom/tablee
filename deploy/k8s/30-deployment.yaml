apiVersion: apps/v1
kind: Deployment
metadata:
  name: tablee
  namespace: tablee
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tablee
  template:
    metadata:
      labels:
        app: tablee
    spec:
      # ── Les migrations avant le service ──────────────────────────────────
      #
      # Un `initContainer` et non un `Job` : le pod ne démarre pas tant que le
      # schéma n'est pas à jour, ce qui est exactement la garantie voulue, et
      # il n'y a rien à relancer à la main à chaque déploiement.
      #
      # Deux pods qui migreraient en même temps — un `maxSurge`, un
      # redémarrage — ne se marchent pas dessus : `scripts/migrate.ts` prend un
      # verrou consultatif Postgres, et le second attend que le premier ait
      # fini. Monter les répliques au-delà de 1 est donc sûr de ce côté-là.
      #
      # ── Le référentiel après le schéma ───────────────────────────────────
      #
      # ⚠️ Renversé le 14/09/2026. Le seed était un geste d'opérateur, joué une
      # fois à la main après le premier déploiement (`job-seed.yaml`). Le geste
      # se faisait mal : une instance fraîche servait une recherche d'aliments
      # vide, et rien ne disait qu'il manquait une étape. Il tourne donc ici, à
      # chaque déploiement, et met à jour ce qui doit l'être.
      #
      # Ça ne coûte rien quand il n'y a rien à faire : `seed-food` lit
      # `referential_import`, voit que l'archive épinglée est déjà en base et
      # s'arrête en une requête. Il ne télécharge et ne relit les 57 Mo de XML
      # que quand `db/seeds/ciqual-source.json` a changé dans l'image.
      #
      # **Il ne peut pas empêcher le pod de démarrer**, et c'est délibéré : le
      # `|| echo` couvre l'ANSES injoignable, un cluster sans sortie réseau, un
      # miroir qui rendrait autre chose que l'archive épinglée. L'app sert très
      # bien sans référentiel — elle affiche « indisponible » là où elle ne
      # sait pas, elle n'invente pas (I1). Coupler son démarrage à la
      # disponibilité d'un site tiers serait le vrai défaut.
      securityContext:
        # Le seed écrit l'export dans le volume ci-dessous, et l'image tourne
        # en `node` (uid 1000).
        fsGroup: 1000

      initContainers:
        - name: migrate
          image: ghcr.io/xhelliom/tablee:latest
          command: ['node', '--import', 'tsx', 'scripts/migrate.ts']
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: tablee, key: DATABASE_URL }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits:   { memory: 512Mi }

        - name: seed
          image: ghcr.io/xhelliom/tablee:latest
          command: ['/bin/sh', '-c']
          args:
            - |
              node --import tsx scripts/seed-refs.ts \
                || echo '⚠️  repères ANSES non chargés : les anneaux diront « indisponible ».'
              node --import tsx scripts/seed-food.ts --dir=/ciqual \
                || echo '⚠️  référentiel Ciqual non chargé : la recherche d’aliments sera vide.'
              exit 0
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: tablee, key: DATABASE_URL }
          volumeMounts:
            - { name: ciqual, mountPath: /ciqual }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            # Le XML est lu en flux, mais l'ETL garde les 3 185 aliments en
            # mémoire le temps des écritures par lots.
            limits:   { memory: 1Gi }

      containers:
        - name: tablee
          image: ghcr.io/xhelliom/tablee:latest
          ports:
            - name: http
              containerPort: 3000

          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: tablee, key: DATABASE_URL }
            - name: TABLEE_SECRET
              valueFrom:
                secretKeyRef: { name: tablee, key: TABLEE_SECRET }

            # ⚠️ L'origine **publique**, telle que le navigateur la voit.
            #
            # better-auth valide l'origine des requêtes avec, et les liens
            # d'invitation en sortent. Une valeur fausse ici donne une app qui
            # refuse les connexions sans dire pourquoi, et des liens
            # d'invitation qui ne mènent nulle part. À remplacer.
            - name: TABLEE_BASE_URL
              value: https://tablee.example.net

            # `1` rallume le journal de requêtes, expurgé des jetons Jow (I6).
            - name: TABLEE_LOG
              value: '0'

          # `/api/me` répond 200 à un anonyme : c'est précisément ce qu'il sert
          # à dire. Il touche la base — donc une sonde qui passe prouve que
          # l'app **et** Postgres répondent, ce qu'une page statique ne dirait
          # pas.
          readinessProbe:
            httpGet: { path: /api/me, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: { path: /api/me, port: http }
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
          # Le démarrage inclut la vérification d'étanchéité et l'ouverture du
          # pool ; laisser jusqu'à 60 s évite qu'une base lente à se réveiller
          # fasse tuer le pod en boucle.
          startupProbe:
            httpGet: { path: /api/me, port: http }
            periodSeconds: 5
            failureThreshold: 12

          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits:   { memory: 512Mi }

          # Rien n'est écrit sur le disque : tout l'état est en base. Le
          # système de fichiers peut donc être en lecture seule, ce qui retire
          # une classe entière de mauvaises surprises.
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
          volumeMounts:
            - name: tmp
              mountPath: /tmp

      volumes:
        - name: tmp
          emptyDir: {}
        # L'export Ciqual décompressé, le temps du seed. Jeté avec le pod :
        # ce qui compte est en base, et le prochain démarrage n'en aura besoin
        # que si la source épinglée a changé.
        - name: ciqual
          emptyDir: { sizeLimit: 256Mi }
