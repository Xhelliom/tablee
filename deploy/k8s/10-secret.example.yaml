# Gabarit. **Ne jamais committer la version remplie.**
#
# Deux valeurs, et aucune n'a de défaut dans le code : le serveur refuse de
# démarrer sans `TABLEE_SECRET`, parce qu'une clé codée en dur et partagée par
# toutes les installations ne protège rien.
#
#   kubectl -n tablee create secret generic tablee \
#     --from-literal=TABLEE_SECRET="$(node -e "console.log(require('crypto').randomBytes(32).toString('base64url'))")" \
#     --from-literal=DATABASE_URL='postgres://tablee:MOTDEPASSE@tablee-postgres:5432/tablee' \
#     --from-literal=POSTGRES_PASSWORD='MOTDEPASSE'
#
# `POSTGRES_PASSWORD` n'est là que si vous utilisez le Postgres fourni dans
# `20-postgres.yaml`. Avec une base externe, seules les deux premières servent.
#
# Pour envoyer des mails, **l'une** de ces deux clés, selon `TABLEE_MAIL` dans
# `30-deployment.yaml` — les deux sont facultatives :
#
#     --from-literal=RESEND_API_KEY='re_…'
#     --from-literal=SMTP_URL='smtps://utilisateur:motdepasse@smtp.example.net:465'
#
# Pour la connexion Google, les deux ensemble — facultatives aussi :
#
#     --from-literal=GOOGLE_CLIENT_ID='…apps.googleusercontent.com'
#     --from-literal=GOOGLE_CLIENT_SECRET='GOCSPX-…'
#
# Pour l'IA — « Découper avec l'IA », « Conseils », les recettes de l'accueil —,
# facultatif aussi ; le modèle se règle dans `30-deployment.yaml`. Poser une
# limite de dépense sur la clé côté console Anthropic : l'inscription est
# ouverte (dette n° 17).
#
#     --from-literal=ANTHROPIC_API_KEY='sk-ant-…'
#
# ⚠️ Le rôle de `DATABASE_URL` **ne doit pas être superutilisateur** : un
# superutilisateur contourne la RLS de la migration 008 en silence, et
# l'étanchéité entre foyers promise au §16 devient décorative. Le serveur
# vérifie et refuse de démarrer — mais autant le savoir avant.

apiVersion: v1
kind: Secret
metadata:
  name: tablee
  namespace: tablee
type: Opaque
stringData:
  TABLEE_SECRET: remplacez-moi-32-caracteres-minimum
  DATABASE_URL: postgres://tablee:remplacez-moi@tablee-postgres:5432/tablee
  POSTGRES_PASSWORD: remplacez-moi
