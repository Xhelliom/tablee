# Réimporter le référentiel **à la demande**. Rien à jouer après un premier
# déploiement : depuis le 14/09/2026, le seed tourne dans un `initContainer` à
# chaque déploiement (`30-deployment.yaml`) et se télécharge lui-même.
#
#   kubectl -n tablee create -f deploy/k8s/job-seed.yaml
#   kubectl -n tablee logs -f job/<le nom généré>
#
# Ce job ne sert donc plus qu'aux cas où l'on veut forcer la main :
#
#   - le `initContainer` a échoué (ANSES injoignable ce jour-là) et on ne veut
#     pas attendre le prochain déploiement ;
#   - on veut réécrire les lignes sans avoir changé la source épinglée — après
#     avoir corrigé `server/food/groups.ts` à la main sur une instance, par
#     exemple. C'est ce que fait `--force`, et c'est la seule chose que
#     l'`initContainer` ne fait jamais tout seul.
#
# ── Ce que ce job ne remplit pas, et c'est voulu ────────────────────────────
#
# `unit_default` et `seasonal_produce` restent **vides** : ce sont des collectes
# humaines (§17), chaque ligne exigeant une source ou une pesée. Les barres
# concernées afficheront « indisponible », jamais 0. C'est le comportement
# attendu, pas un échec de déploiement.
#
# Ciqual d'abord, les repères ensuite : les conversions par aliment
# (`food-unit-weight.csv`) et la saisonnalité se rattachent à ses codes.

apiVersion: batch/v1
kind: Job
metadata:
  generateName: tablee-seed-
  namespace: tablee
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      securityContext:
        fsGroup: 1000

      containers:
        - name: seed
          image: ghcr.io/xhelliom/tablee:latest
          command: ['/bin/sh', '-ceu']
          args:
            - |
              node --import tsx scripts/seed-food.ts --dir=/ciqual --force
              node --import tsx scripts/seed-refs.ts
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: tablee, key: DATABASE_URL }
          volumeMounts:
            - { name: ciqual, mountPath: /ciqual }
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            # Le XML est lu en flux, pas chargé d'un bloc — mais l'ETL garde
            # les aliments en mémoire le temps des écritures par lots.
            limits: { memory: 1Gi }

      # ⚠️ Le seed sort vers `ciqual.anses.fr` pour récupérer l'archive, et
      # refuse de l'importer si elle ne correspond pas à l'empreinte épinglée
      # dans `db/seeds/ciqual-source.json`. Un cluster sans sortie réseau monte
      # ici un volume contenant `alim_*.xml` et `compo_*.xml` à la place de
      # l'`emptyDir` : le seed les prend tels quels et ne télécharge rien.
      volumes:
        - name: ciqual
          emptyDir: { sizeLimit: 256Mi }
