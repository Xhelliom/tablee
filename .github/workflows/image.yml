# Construit et publie l'image sur GitHub Container Registry.
#
# Les tests passent **avant** la publication, et l'image n'est poussée que
# s'ils sont verts : publier une image non testée revient à déplacer le moment
# où on découvre le problème, pas à l'éviter.

name: Image

# Un seul déclencheur par commit. `push` sur toutes les branches **et**
# `pull_request` faisaient tourner deux fois le même travail sur chaque commit
# d'une PR : deux suites de tests, et deux images multi-architecture pour un
# seul commit. Le `push` suffit — il couvre les branches de PR, et le tableau
# des tags de `docs/deploiement-kubernetes.md` en dépend (`<branche>`).
#
# Ce qu'on y perd : une PR venue d'un **fork** ne déclenche plus rien, son
# `push` n'étant pas un événement de ce dépôt. Les gardes
# `if: github.event_name != 'pull_request'` sont conservées telles quelles,
# pour que remettre `pull_request:` ici ne publie pas d'image depuis un fork.
on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

# Une poussée en annule la précédente sur la même référence : pousser trois
# fois d'affilée ne doit pas occuper trois fois les runners. Sauf sur la branche par défaut et sur un tag, où la construction
# publie — l'annuler laisserait un tag sans image.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') && github.ref_name != github.event.repository.default_branch }}

env:
  REGISTRY: ghcr.io

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  test:
    name: Tests et typecheck
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # ⚠️ Le rôle applicatif **ne doit pas être superutilisateur**.
      #
      # `POSTGRES_USER` en est un, et un superutilisateur contourne la RLS de
      # la migration 008 *en silence* : les tests d'étanchéité passeraient au
      # vert sans rien prouver. C'est arrivé pendant l'écriture de la 008, d'où
      # le rôle dédié ci-dessous — et d'où le test qui vérifie que la RLS est
      # effective, qui échouerait ici si on l'oubliait.
      - name: Rôle applicatif non superutilisateur
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 <<'SQL'
            create role tablee login password 'tablee';
            create database tablee_test owner tablee;
          SQL

      # ESLint avant le typecheck : ses règles typées disent des choses que
      # `tsc` ne dit pas — une promesse jamais attendue, un `async` passé là où
      # Fastify attend un gestionnaire. Voir `eslint.config.js`.
      - run: npm run lint

      - run: npm run typecheck

      - name: Tests
        env:
          TEST_DATABASE_URL: postgres://tablee:tablee@localhost:5432/tablee_test
        run: npm test

      # Le front est construit ici aussi : une erreur de compilation Vite ne
      # doit pas attendre l'étape d'image pour se voir.
      - run: npm run build:web

  # ───────────────────────────────────────────────────────────────────────────
  # Chaque architecture se construit sur un runner de la sienne, et rien n'est
  # émulé. ⚠️ Changé le 28/10/2026 : l'arm64 se construisait sous QEMU, et
  # `node:22-alpine` republiée le 17/09 y mourait d'une instruction illégale dès
  # `npm ci` (dette n° 26). `ubuntu-24.04-arm` est gratuit pour un dépôt public.
  #
  # Chaque job pousse son image **par empreinte seulement**, sans tag : c'est
  # `manifeste` qui les réunit sous les tags, en une seule liste multi-arch.
  # Flux suit `latest` par empreinte, il ne voit pas la différence.
  image:
    name: Image (${{ matrix.arch }})
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # `github.repository` est « Xhelliom/tablee » et un nom d'image doit être
      # en minuscules. `metadata-action` s'en charge pour les tags, pas ici.
      - run: echo "IMAGE=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      # Sur une pull request venue d'un fork, le jeton est en lecture seule :
      # on construit pour vérifier que le Dockerfile tient, on ne publie pas.
      - name: Connexion à ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # `metadata-action` remplit `description` depuis celle du dépôt, qui
          # est vide : le label sortait donc vide sur toutes les images. Écrit
          # ici, il reste avec l'image partout où elle va — `docker inspect`,
          # la page du paquet GHCR, un scanner.
          labels: |
            org.opencontainers.image.description=Tablée — suivi alimentaire familial : un repas partagé, un bilan par convive
            org.opencontainers.image.licenses=AGPL-3.0-only

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}
          # Le cache de build est porté par GitHub Actions : sans lui, chaque
          # commit réinstalle tout l'arbre npm. Une portée par architecture,
          # sinon les deux jobs s'écrasent le cache l'un l'autre.
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - name: Empreinte, pour le manifeste
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # ───────────────────────────────────────────────────────────────────────────
  manifeste:
    name: Manifeste multi-architecture
    needs: image
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - run: echo "IMAGE=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Réunir amd64 et arm64 sous les tags
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${IMAGE}@sha256:%s " *)

      # Un manifeste à qui manquerait une architecture se verrait ici, pas sur
      # le Pi au prochain déploiement.
      - name: Vérifier les deux architectures
        run: |
          docker buildx imagetools inspect "${IMAGE}:sha-${GITHUB_SHA}" | tee /tmp/inspect
          grep -q 'linux/amd64' /tmp/inspect
          grep -q 'linux/arm64' /tmp/inspect

      - name: Où l'image est publiée
        run: |
          echo "### Image publiée" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
